[project]
name = "forge-backend"
version = "0.1.0"
description = "Forge AI Engineering Research Assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "httpx",
    "beautifulsoup4",
    "aiofiles"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "black",
    "isort",
    "pre-commit"
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]
